version: '3.9' 

services:
  php-env:
    build: .
    volumes: 
      - ./src:/var/www/html 
    ports:
      - 8080:80
  
  mysql_db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: proiect        
    volumes: 
      - db_data:/var/lib/mysql       
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8081:80
    environment:
      - PMA_ARBITRARY=1

volumes:
  db_data: